<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="B-29" />
<meta name="description" content="B-29 — 2041年、地球低軌道。中古宇宙船でゆっくり宇宙を旅する一人称ゲーム。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>B-29</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hud" class="hidden">
    <div id="fx-vignette"></div>
    <div id="fx-alarm"></div>
    <div id="fx-fade"></div>
    <div id="stick-l" class="stick"><div class="knob"></div></div>
    <div id="stick-r" class="stick"><div class="knob"></div></div>
    <div id="btns-r" class="btn-col">
      <button class="hbtn" id="b-up" aria-label="up"><svg viewBox="0 0 24 24"><path d="M12 5l7 8h-4.5v6h-5v-6H5z"/></svg></button>
      <button class="hbtn" id="b-down" aria-label="down"><svg viewBox="0 0 24 24"><path d="M12 19l-7-8h4.5V5h5v6H19z"/></svg></button>
    </div>
    <div id="btns-tl" class="btn-row">
      <button class="hbtn small" id="b-exit" aria-label="leave"><svg viewBox="0 0 24 24"><path d="M10 4h9v16h-9v-2h7V6h-7z M4 12l5-5v3.5h7v3H9V17z"/></svg></button>
      <button class="hbtn small" id="b-cam" aria-label="camera"><svg viewBox="0 0 24 24"><path d="M3 7h4l2-2h6l2 2h4v12H3z M12 9a4 4 0 100 8 4 4 0 000-8z"/></svg></button>
      <button class="hbtn small" id="b-drop" aria-label="drop"><svg viewBox="0 0 24 24"><path d="M12 3c-1.5 0-2.5 1-2.5 2.5V11L7.8 9.6c-.9-.8-2.2-.7-2.9.2-.6.8-.5 1.9.2 2.6l5.4 5.6c.9.9 2.1 1.5 3.4 1.5H16c2.8 0 5-2.2 5-5V8.5C21 7 20 6 18.7 6c-.5 0-.9.1-1.2.4V5.5C17.5 4 16.5 3 15 3c-.6 0-1.1.2-1.5.5C13.1 3.2 12.6 3 12 3z"/></svg></button>
    </div>
    <div id="cam-ui" class="hidden">
      <button class="hbtn small" id="b-cam-next" aria-label="next camera"><svg viewBox="0 0 24 24"><path d="M8 5l8 7-8 7z"/></svg></button>
    </div>
    <div id="hold-ring"></div>
  </div>
  <div id="rotate" class="hidden">
    <svg viewBox="0 0 120 120" class="rot-ic"><rect x="38" y="20" width="44" height="80" rx="7" fill="none" stroke="#cfd6e4" stroke-width="4"/><circle cx="60" cy="90" r="3" fill="#cfd6e4"/><path d="M96 70a36 36 0 01-30 34" fill="none" stroke="#7fb6ff" stroke-width="4"/><path d="M62 98l6 8 2-10z" fill="#7fb6ff"/></svg>
  </div>
  <div id="boot">
    <div class="boot-inner">
      <div class="logo">B-29</div>
      <div class="sub">2041.06.01 &nbsp;LEO</div>
      <div id="progress"><div id="progress-bar"></div></div>
      <div id="boot-btns" class="hidden">
        <button id="btn-continue" class="bbtn hidden"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span>つづきから</span></button>
        <button id="btn-new" class="bbtn"><svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg><span>はじめから</span></button>
      </div>
      <div id="boot-err" class="hidden"></div>
    </div>
    <div class="boot-foot">Earth imagery: NASA Blue Marble / Black Marble / GEBCO &nbsp;·&nbsp; Stars: HYG (CC BY-SA 4.0) &nbsp;·&nbsp; Moon: NASA SVS LROC</div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
